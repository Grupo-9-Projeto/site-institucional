<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="./output.css">

    <title>Argos - Página Inicial</title>
</head>
   <div class="bg-linear-to-b from-[#09121A] to-[#251F48] ml-5 mr-5 p-20 flex justify-center items-center rounded-2xl">
    <div class="size-fit">
        <p class="font-space-grotesk font-medium text-6xl w-280 mb-5"><span class="text-[#00BCEB] font-bold">Tenha total controle.</span> Monitore seus equipamentos Cisco com Argos.</p>
        <span class="font-poppins text-2xl pb-10">Construído com um novo <span class="font-bold">propósito</span>. Desenhado para infraestrutura de <span class="font-bold">grandes corporações</span>.</span>
        <img src="assets/foto-painel.png" class="rounded-2xl drop-shadow-2xl shadow-black border border-neutral-950 mt-10">
    </div>
</div>   
    <div class="w-full bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-size-[4rem_2rem]">
        <div class="w-full bg-radial from-transparent to-[#09121b] flex justify-center align-center p-30">
            <div class="flex-col justify-center">
                <img src="assets/logos/Cisco-logo.png" class="justify-self-center mb-5">
                <p class="p-5 bg-linear-to-b from-[#049FD9] via-[#083044] to-[#09121B] font-space-grotesk font-bold text-5xl text-center rounded-2xl mb-5">Clientes Cisco utilizam Argos.</p>
                <p class="font-poppins font-medium justify-self-center">Ainda não monitora seus Switches, Firewalls e Routers? <span class="font-bold italic">Cadastre sua empresa já!</span></p>
                <button onclick="" class="justify-self-center rounded-2xl bg-white text-[#09121B] p-5 font-space-grotesk font-bold size-fit flex m-10 duration-100 ease-in hover:bg-[#09121B] hover:text-white hover:cursor-pointer border-solid border-4 border-white">Cadastrar empresa</button>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
