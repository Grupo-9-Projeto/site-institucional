<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos - Gerenciar usuários</title>

    <link rel="stylesheet" href="./output.css">
</head>
<body class="w-[100vw] h-[100vh] bg-[#09121B] text-white flex">
    <div class="w-1/5 h-10/10 bg-[#0D1924]">
        
    </div>
    <div class="w-4/5 h-10/10 p-10 font-jet-brains">
        <div class="flex justify-between">
            <div class="bg-[#0D1924] rounded-[12px] p-5 h-55 w-80">
                <span>Usuários ativos:</span>
            </div>
            <button onclick="ficha.showModal()" class="bg-white text-[#09121B] h-fit p-3 rounded-[12px] hover:cursor-pointer hover:bg-[#09121B] hover:text-white border-2 border-white transition-colors">Adicionar usuário +</button>
        </div>
    </div>

    <dialog id="ficha" class="justify-self-center self-center bg-[#0D1924] rounded-[12px] p-10 h-fit w-fit flex-col items-center">
        <div class="flex flex-col gap-1.5 mb-5">
            <label for="input_email" class="text-sm sm:text-base font-medium text-white">Email</label>
            <input id="input_email" type="email" placeholder="exemplo@gmail.com"
                class="w-full text-sm sm:text-base px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-gray-700 bg-[#15293D] placeholder:text-gray-400 focus:outline-none focus:border-[#00BCEB]">
        </div>

        <div class="flex flex-col gap-1.5 text-white mb-5">
            <p class="text-sm sm:text-base font-medium">Cargo</p>
            <select id="slct_cargo" class="w-full text-sm sm:text-base px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-gray-700 bg-[#15293D] placeholder:text-gray-400 focus:outline-none focus:border-[#00BCEB]">
                <option value="">Selecione um cargo</option>
                <option value="analista-noc">Analista de NOC</option>
                <option value="gestor-redes">Gestor(a) de Redes</option>
            </select>
        </div>

        <div class="w-full flex justify-evenly">
            <button onclick="" class="bg-white text-[#0D1924] h-fit p-3 rounded-[12px] hover:cursor-pointer hover:bg-[#0D1924] hover:text-white border-2 border-white transition-colors">Enviar Token</button> <button onclick="ficha.close()" class="border-2 border-white text-white h-fit p-3 rounded-[12px] hover:bg-white hover:text-[#0D1924] hover:cursor-pointer transition-colors">Cancelar</button>
        </div>
    </dialog>
</body>
</html>
