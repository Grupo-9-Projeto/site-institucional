<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="../../../../assets/logos/Argos-logo_branco.png" type="image/png">

    <title>Argos (Analista) - Home</title>

    <link rel="stylesheet" href="../../../../output.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="../../../../js/api.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="../../../../js/api.js" defer></script>
    <script src="scriptHome.js" defer></script>

</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden" data-page="home">

    <!-- Botão menu mobile -->
    <button id="btn-hamburguer"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-white/15 focus:outline-none">

        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
            </path>
        </svg>

    </button>

    <!-- Overlay sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden">
    </div>


    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-300 bg-[#0B141D] border-r border-white/10 lg:translate-x-0 lg:static lg:w-1/5 shrink-0 h-screen flex flex-col justify-between overflow-hidden">

        <div>

            <!-- Logo -->
            <div class="px-6 py-6 border-b border-white/10 flex gap-3 shrink-0">

                <img src="../../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                    class="h-8 w-auto object-contain">

                <p class="self-center text-xl font-semibold">
                    Argos
                </p>

            </div>


            <!-- Usuário -->
            <div class="px-6 py-6 border-b border-white/10 shrink-0">

                <div id="foto_usuario"
                    class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                </div>

                <p class="mt-3 text-white/60">
                    Olá,
                </p>

                <p class="text-lg font-bold" id="nome_title"></p>

            </div>


            <!-- Navegação -->
            <nav class="flex flex-col py-4">

                <a href="home.html"
                    class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5 transition-element">
                    Home
                </a>

            </nav>

        </div>


        <!-- Opções inferiores -->
        <div class="border-t border-white/10 py-4 shrink-0">

            <a href="../../configuracao/index.html"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">
                Configurações
            </a>

            <a onclick="sair()"
                class="cursor-pointer block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">
                Sair
            </a>

        </div>

    </aside>


    <!-- Conteúdo principal -->
    <main class="flex-1 h-full overflow-y-auto p-4 pt-16 md:p-8 md:pt-8">

        <div class="max-w-[1500px] mx-auto w-full">


            <!-- Cabeçalho -->
            <div class="mb-8">

                <h1 class="text-2xl font-semibold mb-1">
                    Home
                </h1>

                <p class="text-white/60 text-xs">
                    Visão geral dos dispositivos monitorados
                </p>

            </div>


            <!-- Cards das empresas -->
            <div id="containerEmpresas" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 items-stretch">

            </div>


            <!-- Ranking de equipamentos -->
            <div class="mt-10">

                <!-- Cabeçalho do ranking -->
                <div class="mb-5">

                    <h2 class="text-lg font-bold">
                        Equipamentos com mais alertas críticos
                    </h2>

                    <p class="text-white/50 text-xs mt-1">
                        Ranking consolidado de todas as empresas monitoradas
                    </p>

                </div>


                <!-- Tabela do ranking -->
                <div class="w-full overflow-x-auto rounded-xl border border-white/10">

                    <div class="min-w-[900px]">

                        <!-- Cabeçalho -->
                        <div
                            class="grid grid-cols-[60px_minmax(200px,1.5fr)_minmax(120px,0.7fr)_minmax(120px,0.7fr)_minmax(150px,0.8fr)] items-center gap-4 bg-[#111E29] px-6 py-4 text-white/50 text-xs font-bold uppercase min-w-[750px]">

                            <div>
                                Rank
                            </div>

                            <div>
                                Endereço MAC
                            </div>

                            <div>
                                Categoria
                            </div>

                            <div>
                                Status
                            </div>

                            <div class="text-center">
                                Alertas críticos
                            </div>

                        </div>


                        <!-- Equipamentos gerados pelo JavaScript -->
                        <div id="containerRanking">

                        </div>

                    </div>

                </div>

            </div>


        </div>

    </main>

</body>

</html>
