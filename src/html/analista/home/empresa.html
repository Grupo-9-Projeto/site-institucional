<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../assets/logos/Argos-logo_branco.png" type="image/png">
    <title>Argos (Analista) - Empresa</title>

    <link rel="stylesheet" href="../../../output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="mock-data.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden" data-page="empresa">

    <button id="btn-hamburguer"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-white/15 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-300 bg-[#0B141D] border-r border-white/10 lg:translate-x-0 lg:static lg:w-1/5 shrink-0 h-screen flex flex-col justify-between overflow-hidden">

        <div>
            <div class="px-6 py-6 border-b border-white/10 flex gap-3 shrink-0">
                <img src="../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                    class="h-8 w-auto object-contain">
                <p class="self-center text-xl font-semibold">Argos</p>
            </div>

            <div class="px-6 py-6 border-b border-white/10 shrink-0">
                <div
                    class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                    C
                </div>
                <p class="mt-3 text-white/60">Olá,</p>
                <p class="text-lg font-bold">Claudio</p>
            </div>

            <nav class="flex flex-col py-4">
                <a href="./home.html"
                    class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5 transition-element">Home</a>
                <a href="../alertas/index.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Alertas</a>
            </nav>
        </div>

        <div class="border-t border-white/10 py-4 shrink-0">
            <a href="../configuracao/index.html"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>

    </aside>

    <main class="flex-1 h-full overflow-y-auto p-4 pt-16 md:p-8 md:pt-8">
        <div class="max-w-[1500px] mx-auto w-full">

            <div class="flex items-center gap-2 text-xs text-white/60 mb-6">
                <a href="home.html" class="hover:text-white transition-colors">Home</a>
                <span>›</span>
                <span id="empresa-nome-breadcrumb" class="text-white font-semibold">Empresa</span>
            </div>

            <div class="mb-6">
                <h1 id="empresa-titulo" class="text-2xl font-semibold mb-1">Empresa</h1>
                <p id="empresa-subtitulo" class="text-white/60 text-[12px]">Equipamentos vinculados</p>
            </div>

            <section class="w-full rounded-2xl border border-white/10 bg-[#0D1924] overflow-hidden">
                <div class="w-full overflow-x-auto">
                    <table class="w-full text-left text-sm font-poppins min-w-[700px]">
                        <thead>
                            <tr class="h-12 border-b border-white/10 bg-white/[0.02] text-xs font-bold uppercase tracking-wider text-white/60">
                                <th class="py-3 px-4 whitespace-nowrap">Equipamento</th>
                                <th class="py-3 px-4 whitespace-nowrap">Categoria</th>
                                <th class="py-3 px-4 whitespace-nowrap">Status</th>
                                <th class="py-3 px-4 whitespace-nowrap">Conexão</th>
                                <th class="py-3 px-4 whitespace-nowrap">Último alerta</th>
                            </tr>
                        </thead>
                        <tbody id="equipamentos-container"></tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

</body>

</html>
