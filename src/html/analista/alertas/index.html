<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../assets/logos/Argos-logo_branco.png" type="image/png">
    <title>Argos (Analista) - Alertas</title>

    <link rel="stylesheet" href="../../../output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden">

    <button id="btn-hamburguer"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-gray-500 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-300 bg-[#0B141D] border-r border-white/10 lg:translate-x-0 lg:static lg:w-1/5 shrink-0 h-screen flex flex-col justify-between overflow-hidden">

        <div>
            <div class="px-6 py-6 border-b border-white/10 flex gap-3 shrink-0">
                <img src="../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                    class="h-8 w-auto object-contain">
                <p class="self-center text-xl font-semibold">Argos</p>
            </div>

            <div class="px-6 py-6 border-b border-white/10 shrink-0">
                <div
                    class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                    C
                </div>
                <p class="mt-3 text-white/60">Olá,</p>
                <p class="text-lg font-bold">Claudio</p>
            </div>

            <nav class="flex flex-col py-4">
                <a href="../home/home.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Home</a>
                <a href="./index.html"
                    class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5 transition-element">Alertas</a>
            </nav>
        </div>

        <div class="border-t border-white/10 py-4 shrink-0">
            <a href="../configuracoes/index.html"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>

    </aside>

    <main class="flex-1 h-full overflow-y-auto p-4 pt-16 md:p-8 md:pt-8">
        <div class="max-w-[930px] mx-auto w-full">

            <header class="flex flex-col justify-between items-center md:flex-row mb-6 mt-1">
                <div class="flex flex-col w-full md:w-auto">
                    <h1 class="text-white text-2xl font-semibold mb-1">Alertas</h1>
                    <p class="text-white/60 text-[12px]">Central de controle — alertas & status de atendimento</p>
                </div>

                <div id="filtro-severidade" class="flex flex-wrap gap-2 mt-3 md:mt-0">
                    <button type="button" data-severidade="todos"
                        class="btn-filtro px-4 py-2 rounded-md text-xs font-bold bg-light-blue text-main-blue cursor-pointer transition-element">
                        Todos
                    </button>
                    <button type="button" data-severidade="Crítico"
                        class="btn-filtro px-4 py-2 rounded-md text-xs font-semibold border border-white/15 text-white/70 hover:border-white hover:text-white cursor-pointer transition-element">
                        Crítico
                    </button>
                    <button type="button" data-severidade="Atenção"
                        class="btn-filtro px-4 py-2 rounded-md text-xs font-semibold border border-white/15 text-white/70 hover:border-white hover:text-white cursor-pointer transition-element">
                        Atenção
                    </button>
                </div>
            </header>

            <div id="personalizados" class="mb-6">
                <div class="pt-2 flex flex-col items-start gap-4 md:flex-row md:items-center">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-white/60">De</span>
                        <input type="date" id="data-inicio"
                            class="h-9 px-3 rounded-md border border-white/15 bg-main-blue text-xs text-white scheme-dark focus:border-light-blue focus:outline-none cursor-pointer">
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-white/60">Até</span>
                        <input type="date" id="data-fim"
                            class="h-9 px-3 rounded-md border border-white/15 bg-main-blue text-xs text-white scheme-dark focus:border-light-blue focus:outline-none cursor-pointer">
                    </div>
                </div>
            </div>

            <section class="w-full rounded-2xl border border-white/10 bg-[#0D1924] overflow-hidden">
                <div class="w-full">
                    <table class="w-full text-left text-sm font-poppins">
                        <thead>
                            <tr class="h-12 border-b border-white/10 bg-white/[0.02] text-xs font-bold uppercase tracking-wider text-white/60">
                                <th class="py-3 px-3.5 whitespace-nowrap">Dispositivo</th>
                                <th class="py-3 px-3.5 whitespace-nowrap">Tipo</th>
                                <th class="py-3 px-3.5 whitespace-nowrap">Data</th>
                                <th class="py-3 px-3.5 whitespace-nowrap">Severidade</th>
                                <th class="py-3 px-3.5 whitespace-nowrap">SLA</th>
                                <th class="py-3 px-3.5 whitespace-nowrap">Status</th>
                                <th class="py-3 px-3.5 whitespace-nowrap">Analista</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-alertas-body"></tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

</body>

</html>
