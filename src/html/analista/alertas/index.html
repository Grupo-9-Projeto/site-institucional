<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../assets/logos/Argos-logo_branco.png" type="png">
    <title>Argos (analista)- alertas </title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../output.css">

    <link rel="stylesheet" href="../../../output.css">
    <script src="script.js"></script>

</head>

<body class="w-full min-h-screen bg-[#09121B] text-white flex">
    <button id="btn-hamburguer"
        class="fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-gray-500 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden"></div>

    <aside id="sidebar"
        class="fixed top-0 left-0 z-40 w-64 min-h-screen bg-[#0D1924] flex flex-col justify-between border-r border-gray-500 font-['Poppins'] transition-transform duration-300 -translate-x-full">

        <div class="flex flex-col">

            <div class="p-10 pb-6 border-b border-gray-500 h-30 items-center md:h-45">
                <img src="../../../assets/logos/Argos-logo_branco.png" alt="Argos"
                    class="p-2 h-20 w-auto ml-13 -mt-5 object-contain md:h-26 md:ml-0 md:mt-0 lg:h-30">
            </div>

            <div class="px-10 py-6 border-b border-gray-500 flex flex-col items-center md:items-start">
                <div
                    class="w-16 h-16 rounded-full bg-[#09121B] border-2 border-blue-500 flex items-center justify-center text-cyan-400 font-bold text-xl shrink-0 mb-3 ml-0 md:-ml-2">
                    C
                </div>
                <p class="text-sm text-gray-300">Olá</p>
                <p class="font-bold text-white text-base">Claudio</p>
            </div>

            <nav class="mt-6">
                <ul class="flex flex-col gap-6 text-left">
                    <li class="pl-4 hover:font-semibold text-gray-300 hover:text-white cursor-pointer">
                        <a href="#" class="block">Home</a>
                    </li>
                    <li class="border-l-4 border-blue-500 pl-3 font-bold text-blue-400">
                        <a href="#" class="block">Alertas</a>
                    </li>
                </ul>
            </nav>
        </div>

        <div>
            <ul class="border-t border-gray-500 flex flex-col gap-6 text-left mb-6  md:mb-8">
                <li class="mt-5 pl-4 hover:font-semibold text-gray-300 hover:text-white cursor-pointer">
                    <a href="#" class="block">Configurações</a>
                </li>
                <li class="pl-4 hover:font-semibold text-gray-300 hover:text-white cursor-pointer">
                    <a href="#" class="block">Sair</a>
                </li>
            </ul>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <div class="flex flex-col justify-between items-center md:flex-row">
            <div class="flex flex-col">
                <p class="text-white text-2xl font-['Poppins'] font-semibold mb-6 -mt-2 -ml-9 translate-x-8 md:translate-x-0 md:ml-13 lg:ml-0">
                    Alertas
                </p>
                <p class="text-gray-500 font-['Poppins'] text-[12px] -mt-4 md:ml-13 lg:ml-0">Alertas & Status de Atendimento</p>
            </div>

            <div class="flex flex-wrap gap-4 mt-3">
                <button class="btn-filtro rounded text-[14px] px-4 h-9 border border-transparent bg-blue-500 text-[#09121B] font-semibold cursor-pointer transition-colors">
                    Todos
                </button>
                <button class="btn-filtro rounded text-[14px] px-4 h-9 border border-gray-400 text-gray-400 font-semibold hover:border-white hover:text-white cursor-pointer transition-colors">
                    Crítico
                </button>
                <button class="btn-filtro rounded text-[14px] px-4 h-9 border border-gray-400 text-gray-400 font-semibold hover:border-white hover:text-white cursor-pointer transition-colors">
                    Atenção
                </button>
            </div>
        </div>

        <div id="personalizados" class="max-h-43 transition-all duration-500 ease-in-out font-['Poppins'] mb-6">
            <div class="pt-4 mt-4 flex flex-col items-start gap-4 md:flex-row">
                <div class="flex flex-row gap-3">
                    <p class="text-gray-400 text-[14px] mt-2 lg:mt-2">De</p>
                    <input type="date" id="data-inicio" name="data-inicio" class="bg-[#09121B] border border-gray-400 text-gray-300 px-3 text-[14px] rounded h-9 focus:border-blue-500 focus:outline-none cursor-pointer">
                </div>

                <div class="flex flex-row gap-3">
                    <p class="text-gray-400 text-[14px] mt-2 lg:mt-2">Até</p>
                    <input type="date" id="data-fim" name="data-fim" class="bg-[#09121B] border border-gray-400 text-gray-300 px-3 text-[14px] rounded h-9 focus:border-blue-500 focus:outline-none cursor-pointer">
                </div>
            </div>
        </div>

        <div class="mt-6 overflow-x-auto rounded-lg border border-gray-800 bg-[#0D1924]">
            <table class="w-full text-left text-sm text-gray-400 font-['Poppins']">
                <thead class="text-xs uppercase bg-[#09121B] text-gray-400 border-b border-gray-700">
                    <tr>
                        <th class="py-3 px-4">Dispositivo</th>
                        <th class="py-3 px-4">Tipo</th>
                        <th class="py-3 px-4">Data</th>
                        <th class="py-3 px-4">Severidade</th>
                        <th class="py-3 px-4">SLA</th>
                        <th class="py-3 px-4">Status</th>
                        <th class="py-3 px-4">Analista</th>
                    </tr>
                </thead>
                <tbody id="tabela-alertas-body">
                </tbody>
            </table>
        </div>
    </main>

</body>

</html>
