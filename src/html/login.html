<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos - Login</title>

    <link rel="stylesheet" href="../output.css">
</head>

<body class="font-space-grotesk select-none">
    <div class="min-h-screen lg:h-screen w-full bg-[#09121B] flex flex-col lg:flex-row lg:gap-4 lg:p-8 text-white lg:overflow-hidden">
        <div class="w-full  lg:w-[65%] lg:min-w-0 flex lg:border lg:border-white bg-transparent lg:bg-gradient-to-b lg:from-[#09121B] lg:to-[#251E47] lg:gradient-border p-4 sm:p-6 lg:p-[clamp(16px,4vh,40px)] lg:overflow-hidden">
            <div class="flex lg:flex-col w-full">   
                <div class="text-2xl md:text-3xl lg:text-[clamp(24px,5.5vh,60px)] shrink-0">
                    <button  class="transition-transform duration-300 hover:scale-120">
                        ←
                    </button>
                </div>
                <div class="hidden lg:flex lg:mt-auto flex justify-center shrink-0">
                    <img class="max-w-[44px] sm:max-w-[56px] md:max-w-[80px] lg:max-w-[288px] max-h-[8vh] lg:max-h-[26vh] w-auto h-auto object-contain transition-transform duration-300 hover:scale-110" src="../assets/logos/Argos-logo_branco.png" alt="Logo Argos Branca">
                </div>
                <div class="hidden lg:block lg:mt-auto lg:flex-none min-w-0">
                    <h3 class="font-medium text-xs sm:text-sm md:text-base lg:text-[clamp(20px,4.4vh,48px)] leading-tight truncate lg:whitespace-normal">
                        <span class="block">Tenha <span class="font-bold">total controle.</span></span>
                        <span class="block">Monitore seus equipamentos</span>
                        <span class="block">Cisco com <span class="font-bold">Argos.</span></span>
                    </h3>
                </div>
            </div>
        </div>
        <div class="w-full flex-1 lg:w-[35%] lg:min-w-0  flex flex-col justify-center gradient-border bg-gradient-to-b from-[#09121B] to-[#251E47] p-5 sm:p-6 md:p-8 lg:p-[clamp(16px,4vh,40px)]  lg:overflow-hidden">
            <div>
                <div class="flex items-center justify-center">
                    <h1 class="font-bold text-2xl sm:text-3xl lg:text-[clamp(26px,5.4vh,48px)] mb-6 sm:mb-8 lg:mb-[clamp(16px,5.4vh,48px)] transition-transform duration-300 hover:scale-120">Faça Log In</h1>
                </div>
                <div class="flex flex-col gap-6 sm:gap-8 lg:gap-[clamp(16px,5.4vh,48px)]">
                    <div class="flex flex-col gap-3 lg:gap-[clamp(8px,2.7vh,24px)] w-full font-jet-brains">
                        <div class="flex flex-col gap-1.5 sm:gap-2 lg:gap-[clamp(3px,1.1vh,10px)]">
                            <span class="text-sm sm:text-base lg:text-[clamp(11px,2vh,18px)]">Email</span>
                            <input class="text-sm sm:text-base lg:text-[clamp(11px,1.8vh,16px)] w-full rounded-[12px] border-2 lg:py-[clamp(5px,1.4vh,12px)] p-2 sm:p-2.5 lg:px-4 px-3 sm:px-4 bg-[#15293D] placeholder:text-gray-400" placeholder:text-gray-400" type="text" placeholder="exemplo@gmail.com">
                        </div>
                        <div class="flex flex-col gap-1.5 sm:gap-2 lg:gap-[clamp(3px,1.1vh,10px)]">
                            <span class="text-sm sm:text-base lg:text-[clamp(11px,2vh,18px)]">Senha</span>
                            <input class="text-sm sm:text-base lg:text-[clamp(11px,1.8vh,16px)] w-full rounded-[12px] border-2 lg:py-[clamp(5px,1.4vh,12px)] p-2 sm:p-2.5 lg:px-4 px-3 sm:px-4 bg-[#15293D]  placeholder:text-gray-400" type="password" placeholder="Sua senha aqui">
                        </div>
                    </div>
                    <div class="w-full">
                        <button class="transition-transform duration-300 hover:scale-105 w-full lg:py-[clamp(4px,1.1vh,10px)] p-2 sm:p-2.5 rounded-[12px] text-(--main-blue) font-bold text-lg sm:text-xl lg:text-[clamp(15px,3.4vh,30px)] bg-(--off-white) transition-element transition-all duration-200 hover:border-4 hover:border-(--light-blue)">Log In →</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
