<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../assets/logos/Argos-logo_branco.png" type="image/png">
    <title>Argos (gerente)- chamados</title>

    <link rel="stylesheet" href="../../../output.css">
    <script src="script.js" defer></script>
</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden">
    <aside class="w-1/5 shrink-0 h-full flex flex-col bg-[#0B141D] border-r border-white/10">
        <div class="px-6 py-6 border-b border-white/10 flex gap-3 ">
            <img src="../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                class="h-8 w-auto object-contain">
            <p class="self-center text-xl font-semibold">Argos</p>
        </div>
        <div class="px-6 py-6 border-b border-white/10">
            <div
                class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                V</div>
            <p class="mt-3 text-white/60">Olá,</p>
            <p class="text-lg font-bold">Vivian</p>
        </div>a
        <nav class="flex-1 flex flex-col py-4">
            <a href="../home.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Home</a>
            <a href="../empresas/index.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Empresas</a>
            <a href="../funcionarios/index.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Funcionários</a>
            <a href="./index.html"
                class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5">Histórico
                de Chamados</a>
            <a href="../relatorio.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Gerar
                Relatório</a>
        </nav>
        <div class="border-t border-white/10 py-4">
            <a href="#"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>
    </aside>

    <main class="flex-1 min-w-0 h-full overflow-y-auto p-8">
        <h1 class="text-2xl font-bold">Histórico de Chamados</h1>
        <p class="mt-1 text-[11px] text-gray-400">Central de controle — histórico completo de violações de nível de
            serviço</p>

        <section class="mt-8 w-full rounded-lg bg-[#0D1924] border border-white/10 overflow-hidden">
            <!-- Filtros -->
            <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 px-5 py-4">
                <h2 class="text-[13px] font-bold">Registro de Violações</h2>

                <div class="flex flex-wrap items-center gap-2">
                    <!-- Período -->
                    <div id="filtro-periodo" class="flex gap-1 p-1 rounded-md border border-white/10 bg-white/[0.03]">
                        <button type="button" data-periodo="ultima-semana"
                            class="btn-periodo rounded px-3 h-6 text-[10px] font-bold border cursor-pointer transition-element">Última
                            semana</button>
                        <button type="button" data-periodo="ultimo-mes"
                            class="btn-periodo rounded px-3 h-6 text-[10px] font-bold border cursor-pointer transition-element">Último
                            mês</button>
                        <button type="button" data-periodo="personalizado"
                            class="btn-periodo rounded px-3 h-6 text-[10px] font-bold border cursor-pointer transition-element">Período
                            personalizado</button>
                    </div>

                    <!-- Datas (só aparecem em "Período personalizado") -->
                    <div id="datas" class="hidden items-center gap-2">
                        <label for="data-inicial" class="text-[10px] font-bold text-gray-400">De</label>
                        <input type="date" id="data-inicial"
                            class="h-[30px] w-[140px] px-3 rounded border border-white/10 bg-[#09121B] text-xs text-white scheme-dark focus:border-light-blue focus:outline-none cursor-pointer">
                        <label for="data-final" class="text-[10px] font-bold text-gray-400">Até</label>
                        <input type="date" id="data-final"
                            class="h-[30px] w-[140px] px-3 rounded border border-white/10 bg-[#09121B] text-xs text-white scheme-dark focus:border-light-blue focus:outline-none cursor-pointer">
                    </div>

                    <!-- Equipamento (opções geradas via JS a partir dos dados) -->
                    <select id="filtro-equipamento"
                        class="h-[30px] px-3 rounded border border-white/10 bg-[#09121B] text-xs text-white scheme-dark focus:border-light-blue focus:outline-none cursor-pointer">
                        <option value="">Equipamento: Todos</option>
                    </select>

                    <!-- Status -->
                    <div id="filtro-status" class="flex items-center gap-2">
                        <button type="button" data-status="todos"
                            class="btn-status rounded px-3 h-[26px] text-[10px] font-bold border cursor-pointer transition-element">Todos</button>
                        <button type="button" data-status="Em Aberto"
                            class="btn-status rounded px-3 h-[26px] text-[10px] font-bold border cursor-pointer transition-element">Em
                            Aberto</button>
                        <button type="button" data-status="Resolvido"
                            class="btn-status rounded px-3 h-[26px] text-[10px] font-bold border cursor-pointer transition-element">Resolvidos</button>
                    </div>
                </div>
            </div>

            <!-- Tabela -->
            <div class="overflow-x-auto">
                <table class="w-full min-w-[900px] table-fixed text-left">
                    <colgroup>
                        <col style="width: 100px">
                        <col style="width: 90px">
                        <col>
                        <col>
                        <col style="width: 140px">
                        <col style="width: 100px">
                        <col style="width: 130px">
                    </colgroup>
                    <thead>
                        <tr
                            class="h-9 bg-[#0B141D] border-y border-white/10 text-[10px] font-bold uppercase tracking-wider text-gray-400">
                            <th class="pl-5 font-bold">ID</th>
                            <th class="font-bold">Data</th>
                            <th class="font-bold">Empresa</th>
                            <th class="font-bold">Equipamento</th>
                            <th class="font-bold">Violação</th>
                            <th class="font-bold">Prioridade</th>
                            <th class="pr-5 font-bold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-violacoes"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
