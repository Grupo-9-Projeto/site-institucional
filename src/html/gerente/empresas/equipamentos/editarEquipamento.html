<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../../assets/logos/Argos-logo_branco.png" type="png">
    <title>Argos (gerente)- equipamentos</title>
    <link rel="stylesheet" href="../../../../output.css">
</head>
<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden">
    <aside class="w-1/5 shrink-0 h-full flex flex-col bg-[#0B141D] border-r border-white/10">
        <div class="px-6 py-6 border-b border-white/10 flex gap-3 ">
            <img src="../../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos" class="h-8 w-auto object-contain">
            <p class="self-center text-xl font-semibold">Argos</p>
        </div>
        <div class="px-6 py-6 border-b border-white/10">
            <!-- Aqui podemos fazer a foto de perfil do usuário ou só manter a primeira letra do nome provisoriamente -->
            <div class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">U</div>
            <p class="mt-3 text-white/60">Olá,</p>
            <!-- Aqui tem que alterar para receber nome do usuário da sessão (puxar do session.user?) -->
            <p class="text-lg font-bold">Usuário</p>
        </div>
        <nav class="flex-1 flex flex-col py-4">
            <a href="../home.html" class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Home</a>
            <a href="./index.html" class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5">Empresas</a>
            <a href="../funcionarios/index.html" class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Funcionários</a>
            <a href="../chamados/index.html" class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Histórico de Chamados</a>
            <a href="../relatorio.html" class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Gerar Relatório</a>
        </nav>
        <div class="border-t border-white/10 py-4">
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>
    </aside>
    <main class="flex-1 h-full overflow-y-auto p-9">
        <section class="max-w-3xl rounded-2xl border border-white/10 bg-[#0D1924] p-8">
            <header class="flex items-start justify-between">
                <div>
                    <p class="text-xs font-bold text-white/60">Editar informações</p>
                    <div class="mt-1 flex items-center gap-3">
                        <h1 class="text-2xl font-bold">Equipamento 1</h1>
                        <span class="px-3 py-1 rounded-md border border-light-blue/40 bg-light-blue/10 text-xs font-bold text-light-blue">Ativo</span>
                    </div>
                </div>
                <span class="text-sm text-white/50">00/00/2000</span>
            </header>
            <!-- Deixei os values de exemplo mas tem que tirar para receber os valores do equipamento atual -->
            <form class="mt-6 flex flex-col gap-5">
                <div class="flex flex-col gap-2">
                    <label for="categoria" class="text-sm font-bold text-white/60">Categoria</label>
                    <input id="categoria" name="categoria" type="text" value="Firewall" class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="modelo" class="text-sm font-bold text-white/60">Modelo</label>
                    <input id="modelo" name="modelo" type="text" value="Cisco ASA 5505" class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="ip" class="text-sm font-bold text-white/60">IP</label>
                    <input id="ip" name="ip" type="text" value="192.168.1.2" class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="mac" class="text-sm font-bold text-white/60">Endereço Mac</label>
                    <input id="mac" name="mac" type="text" value="AA:BB:CC:DD:EE:02" class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="serie" class="text-sm font-bold text-white/60">Número de série</label>
                    <input id="serie" name="serie" type="text" value="SN-0002-FW" class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="status" class="text-sm font-bold text-white/60">Status</label>
                    <input id="status" name="status" type="text" value="Ativo" class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex justify-end gap-3">
                    <a href="../informacoesEmpresa.html" class="px-5 py-2.5 rounded-md border border-white/20 text-sm font-bold hover:bg-white/10 transition-element">Cancelar</a>
                    <a href="../informacoesEmpresa.html" class="px-6 py-2.5 rounded-md bg-light-blue text-main-blue text-sm font-bold hover:brightness-110 transition-element cursor-pointer">Salvar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
