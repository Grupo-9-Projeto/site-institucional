<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos (gerente) - Informações da Empresa</title>

    <link rel="shortcut icon" href="../../../../assets/logos/Argos-logo_branco.png" type="image/png">
    <link rel="stylesheet" href="../../../../output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../../../js/api.js" defer></script>
    <script src="./script.js" defer></script>
</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden">

    <button id="btn-hamburguer"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-gray-500 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-300 bg-[#0B141D] border-r border-white/10 lg:translate-x-0 lg:static lg:w-1/5 shrink-0 h-screen flex flex-col justify-between overflow-hidden">

        <div>
            <div class="px-6 py-6 border-b border-white/10 flex gap-3 shrink-0">
                <img src="../../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                    class="h-8 w-auto object-contain">
                <p class="self-center text-xl font-semibold">Argos</p>
            </div>

            <div class="px-6 py-6 border-b border-white/10 shrink-0">
                <div
                    class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                    V
                </div>
                <p class="mt-3 text-white/60">Olá,</p>
                <p class="text-lg font-bold">Vivian</p>
            </div>

            <nav class="flex flex-col py-4">
                <a href="../../home.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Home</a>
                <a href="../../empresas/index.html"
                    class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5">Empresas</a>
                <a href="../../funcionarios/index.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Funcionários</a>
                <a href="../../chamados/index.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Histórico
                    de Chamados</a>
                <a href="../../relatorio.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Gerar
                    Relatório</a>
            </nav>
        </div>

        <div class="border-t border-white/10 py-4 shrink-0">
            <a href="../../configuracoes/index.html"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>

    </aside>


    <main class="flex-1 h-full overflow-y-auto p-9">

        <a id="link-voltar" href="../informacoesEquipamento.html"
            class="flex w-fit items-center gap-2 mb-6 mt-6  ml-22 lg:mt-0 text-sm text-white/60 hover:text-light-blue transition-element">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Voltar para Informações da empresa
        </a>

        <section class="max-w-3xl mx-auto rounded-2xl border border-white/10 bg-[#0D1924] p-8">


            <header class="flex items-start justify-between mb-10">
                <div>
                    <p class="text-xs text-white/60">Editar informações</p>
                    <div class="mt-1 flex items-center gap-3">

                        <h1 id="edit-eq-nome" class="text-2xl font-bold">Equipamento 1</h1>

                        <span id="edit-eq-status-badge"
                            class="px-3 py-1 rounded-md border border-light-blue/40 bg-light-blue/10 text-xs font-bold text-light-blue">Ativo</span>
                    </div>
                </div>
                <span id="edit-eq-data" class="text-sm text-white/50">00/00/2000</span>
            </header>

            <form id="form-editar-dispositivo" class="mt-6 flex flex-col gap-5" onsubmit="criarNovoEquipamento(event)">

                <div class="flex flex-col gap-2">
                    <label for="categoria" class="text-sm font-bold text-white/60">Categoria</label>
                    <input id="categoria" name="categoria" type="text" value="Ativo" disabled
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-black focus:bg-black/60 focus:text-black/60 focus:outline-none transition-element">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="modelo" class="text-sm font-bold text-white/60">Modelo</label>
                    <input id="modelo" name="modelo" type="text" value="Cisco ASA 5505" disabled
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="ip" class="text-sm font-bold text-white/60">IP</label>
                    <input id="ip" name="ip" type="text" value="192.168.1.2"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="mac" class="text-sm font-bold text-white/60">Endereço Mac</label>
                    <input id="mac" name="mac" type="text" value="AA:BB:CC:DD:EE:02"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="serie" class="text-sm font-bold text-white/60">Número de série</label>
                    <input id="serie" name="serie" type="text" value="SN-0002-FW"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="status" class="text-sm font-bold text-white/60">Status</label>
                    <input id="status" name="status" type="text" value="Ativo"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex justify-end gap-3">
                    <a
                        class="px-5 py-2.5 rounded-md border border-white/20 text-sm font-bold hover:bg-white/10 transition-element">Cancelar</a>
                    <button type="submit"
                        class="px-6 py-2.5 rounded-md bg-light-blue text-main-blue text-sm font-bold hover:brightness-110 transition-element cursor-pointer">
                        Salvar
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
