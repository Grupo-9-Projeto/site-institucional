<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos (gerente) - Novo Componente</title>

    <link rel="shortcut icon" href="../../../../../assets/logos/Argos-logo_branco.png" type="image/png">
    <link rel="stylesheet" href="../../../../../output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./novoComponente.js" defer></script>
    <script src="./../../../../../js/api.js" defer></script>

</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden">

    <button id="btn-hamburguer"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-gray-500 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-300 bg-[#0B141D] border-r border-white/10 lg:translate-x-0 lg:static lg:w-1/5 shrink-0 h-screen flex flex-col justify-between overflow-hidden">

        <div>
            <div class="px-6 py-6 border-b border-white/10 flex gap-3 shrink-0">
                <img src="../../../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                    class="h-8 w-auto object-contain">
                <p class="self-center text-xl font-semibold">Argos</p>
            </div>

            <div class="px-6 py-6 border-b border-white/10 shrink-0">
                <div
                    class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                    V
                </div>
                <p class="mt-3 text-white/60">Olá,</p>
                <p class="text-lg font-bold">Vivian</p>
            </div>

            <nav class="flex flex-col py-4">
                <a href="../../../home.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Home</a>
                <a href="../../../empresas/index.html"
                    class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5">Empresas</a>
                <a href="../../../funcionarios/index.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Funcionários</a>
                <a href="../../../chamados/index.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Histórico
                    de Chamados</a>
                <a href="../../../relatorio.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Gerar
                    Relatório</a>
            </nav>
        </div>

        <div class="border-t border-white/10 py-4 shrink-0">
            <a href="../../../configuracoes/index.html"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>

    </aside>

    <main class="flex-1 h-full overflow-y-auto p-4 pt-12 md:p-8 md:pt-8 lg:pt-8">
        <div class="max-w-3xl mx-auto w-full">

            <a id="link-voltar" onclick="voltarPagina()"
                class="cursor-pointer flex w-fit items-center gap-2 mb-6 mt-6 lg:mt-0 text-sm text-white/60 hover:text-light-blue transition-element">
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
                Voltar para Informações do Equipamento
            </a>

            <section class="w-full rounded-xl border border-white/10 bg-[#0D1924] p-6 md:p-8">
                <header class="mb-6">
                    <p class="text-xs text-white/60">Informações</p>
                    <h1 class="mt-1 text-2xl font-bold">Novo Componente</h1>
                </header>

                <form id="form-novo-componente" class="mt-6 flex flex-col gap-5">
                    
                    <div class="flex flex-col gap-2">
                        <label for="nome" class="text-sm font-bold text-white/60">Nome identificador</label>
                        <input id="nome" name="nome" type="text" placeholder="Ex: CPU Principal" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/30 focus:border-light-blue focus:outline-none transition-element">
                    </div>
     
                    <div class="flex flex-col gap-2">
                        <label for="tipo" class="text-sm font-bold text-white/60">Tipo</label>
                        <select id="tipo" name="tipo" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm text-white focus:border-light-blue focus:outline-none transition-element">
                            <option value="" disabled selected class="text-white/40">Selecione uma categoria</option>
                            <option value="CPU" class="bg-main-blue text-white">CPU</option>
                            <option value="Memória" class="bg-main-blue text-white">Memória</option>
                            <option value="Rede" class="bg-main-blue text-white">Rede</option>
                            <option value="Disco" class="bg-main-blue text-white">Disco</option>
                        </select>
                    </div>
     
                    <div class="flex flex-col gap-2">
                        <label for="unidade" class="text-sm font-bold text-white/60">Unidade de medida</label>
                        <input id="unidade" name="unidade" type="text" placeholder="Ex: %, GB, Mbps" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/30 focus:border-light-blue focus:outline-none transition-element">
                    </div>
     
                    <div class="flex flex-col gap-2">
                        <label for="Capacidade_total" class="text-sm font-bold text-white/60">Capacidade Total</label>
                        <input id="Capacidade_total" name="Capacidade_total" type="text" placeholder="Ex: 100" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/30 focus:border-light-blue focus:outline-none transition-element">
                    </div>
     
                    <div class="flex flex-col gap-2">
                        <label for="limiar_critico" class="text-sm font-bold text-white/60">Limiar crítico</label>
                        <input id="limiar_critico" name="limiar_critico" type="text" placeholder="Ex: 95" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/30 focus:border-light-blue focus:outline-none transition-element">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="limiar_alto" class="text-sm font-bold text-white/60">Limiar alto</label>
                        <input id="limiar_alto" name="limiar_alto" type="text" placeholder="Ex: 85" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/30 focus:border-light-blue focus:outline-none transition-element">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="limiar_atencao" class="text-sm font-bold text-white/60">Limiar de atenção</label>
                        <input id="limiar_atencao" name="limiar_atencao" type="text" placeholder="Ex: 70" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/30 focus:border-light-blue focus:outline-none transition-element">
                    </div>
<!--      
                    <div class="flex flex-col gap-2">
                        <label for="status" class="text-sm font-bold text-white/60">Status</label>
                        <select id="status" name="status" required class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm text-white focus:border-light-blue focus:outline-none transition-element">
                            <option value="1" selected class="bg-main-blue text-white">Ativo</option>
                            <option value="0" class="bg-main-blue text-white">Inativo</option>
                        </select>
                    </div> -->
     
                    <div class="flex justify-end gap-3 mt-4">
                        <a id="link-cancelar" onclick="voltarPagina()" class="cursor-pointer px-5 py-2.5 rounded-md border border-white/20 text-sm font-bold hover:bg-white/10 outline-none focus:outline-none focus:ring-0 transition-element">Cancelar</a>
                        <button type="button" onclick="criarComponente()" class="px-6 py-2.5 rounded-md bg-light-blue text-main-blue text-sm font-bold hover:brightness-110 outline-none focus:outline-none focus:ring-0 transition-element cursor-pointer">Salvar</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
