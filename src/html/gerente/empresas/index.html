<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos (gerente) - Empresas</title>

    <link rel="shortcut icon" href="../../../assets/logos/Argos-logo_branco.png" type="image/png">
    <link rel="stylesheet" href="../../../output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js" defer></script>
</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden">

    <button id="btn-hamburguer"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-gray-500 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-300 bg-[#0B141D] border-r border-white/10 lg:translate-x-0 lg:static lg:w-1/5 shrink-0 h-full flex flex-col overflow-y-auto">

        <div class="px-6 py-6 border-b border-white/10 flex gap-3 shrink-0">
            <img src="../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                class="h-8 w-auto object-contain">
            <p class="self-center text-xl font-semibold">Argos</p>
        </div>

        <div class="px-6 py-6 border-b border-white/10 shrink-0">
            <div
                class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                V
            </div>
            <p class="mt-3 text-white/60">Olá,</p>
            <p class="text-lg font-bold">Vivian</p>
        </div>

        <nav class="flex-1 flex flex-col py-4">
            <a href="../home.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Home</a>
            <a href="./index.html"
                class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5">Empresas</a>
            <a href="../funcionarios/index.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Funcionários</a>
            <a href="../chamados/index.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Histórico
                de Chamados</a>
            <a href="../relatorio.html"
                class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Gerar
                Relatório</a>
        </nav>

        <div class="border-t border-white/10 py-4 shrink-0">
            <a href="#"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto h-full w-full pt-16 md:pt-8">
        <div class="max-w-4xl mx-auto w-full">

            <header class="flex flex-col justify-between gap-4 md:flex-row md:items-center mb-6">
                <p class="text-white text-2xl font-semibold">Empresas</p>
                <button
                    class="flex items-center justify-center gap-2 px-5 py-2.5 rounded-md bg-light-blue text-main-blue text-sm font-medium hover:brightness-110 transition-element cursor-pointer w-full md:w-auto"
                    onclick="abrirModal()">
                    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    Adicionar Empresa
                </button>
            </header>

            <section id="lista-empresas-container" class="w-full flex flex-col gap-3">
            </section>

        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="w-full max-w-md rounded-2xl border border-white/10 bg-[#0D1924] p-8 shadow-2xl">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold">Adicionar Empresa</h2>
                <button class="text-white/60 hover:text-white text-2xl leading-none transition-element cursor-pointer"
                    onclick="fecharModal()">&times;</button>
            </div>
            <form class="mt-6 flex flex-col gap-5" onsubmit="event.preventDefault();">
                <div class="flex flex-col gap-2">
                    <label for="nome" class="text-sm font-bold text-white/60">Nome</label>
                    <input id="nome" type="text" placeholder="Nome da empresa"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm text-white placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="cnpj" class="text-sm font-bold text-white/60">CNPJ</label>
                    <input id="cnpj" type="text" placeholder="00.000.000/0000-00"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm text-white placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>

                <hr class="border-white/10 my-1">

                <p class="text-light-blue font-bold">Contrato de SLA</p>

                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex flex-col flex-1 gap-2">
                        <label for="SLA" class="text-sm font-bold text-white/60">Nível do SLA</label>
                        <select id="SLA"
                            class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm text-white focus:border-light-blue focus:outline-none transition-element cursor-pointer">
                            <option value="selecione" class="bg-main-blue text-white/40" disabled selected>Selecione</option>
                            <option value="bronze" class="bg-main-blue text-white">Bronze</option>
                            <option value="prata" class="bg-main-blue text-white">Prata</option>
                            <option value="ouro" class="bg-main-blue text-white">Ouro</option>
                        </select>
                    </div>

                    <div class="flex flex-col flex-1 gap-2">
                        <label for="limite" class="text-sm font-bold text-white/60">Limite de resposta</label>
                        <input id="limite" type="text" placeholder="Ex: 2 horas"
                            class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm text-white placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                    </div>
                </div>

                <div class="flex flex-col flex-1 gap-2">
                    <label for="status" class="text-sm font-bold text-white/60">Status do SLA</label>
                    <select id="status"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm text-white focus:border-light-blue focus:outline-none transition-element cursor-pointer">
                        <option value="ativo" class="bg-main-blue text-white">Ativo</option>
                        <option value="inativo" class="bg-main-blue text-white">Inativo</option>
                        <option value="suspenso" class="bg-main-blue text-white">Suspenso</option>
                    </select>
                </div>

                <div class="flex justify-end gap-3 mt-2">
                    <button type="button" onclick="fecharModal()"
                        class="px-6 py-2.5 rounded-md text-white/90 text-sm font-medium hover:bg-white/5 transition-element cursor-pointer border border-white/15">Cancelar</button>
                    <button type="submit"
                        class="px-6 py-2.5 rounded-md bg-light-blue text-main-blue text-sm font-medium hover:brightness-110 transition-element cursor-pointer">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal_excluir"
        class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="w-full max-w-md rounded-2xl border border-white/10 bg-[#0D1924] p-8 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-bold">Deseja excluir essa empresa?</h2>
            </div>
            <div class="flex justify-end gap-3">
                <button type="button"
                    class="px-6 py-2.5 rounded-md text-white/90 text-sm font-medium hover:bg-white/5 transition-element cursor-pointer border border-white/15"
                    onclick="fecharModalExcluir()">Não</button>
                <button type="button"
                    class="px-6 py-2.5 rounded-md bg-red-500 text-main-blue text-sm font-bold hover:brightness-110 transition-element cursor-pointer"
                    onclick="fecharModalExcluir()">Sim</button>
            </div>
        </div>
    </div>

</body>

</html>
