<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos (gerente) - Funcionários</title>

    <link rel="shortcut icon" href="../../../assets/logos/Argos-logo_branco.png" type="image/png">
    <link rel="stylesheet" href="../../../output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
</head>

<body class="h-screen w-screen flex bg-main-blue text-white font-poppins overflow-hidden">

    <button id="btn-hamburguer"
        class="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#0D1924] text-white rounded-lg border border-gray-500 focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
    </button>

    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

    <aside id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full transition-transform duration-300 bg-[#0B141D] border-r border-white/10 lg:translate-x-0 lg:static lg:w-1/5 shrink-0 h-screen flex flex-col justify-between overflow-hidden">

        <div>
            <div class="px-6 py-6 border-b border-white/10 flex gap-3 shrink-0">
                <img src="../../../assets/logos/Argos-logo_branco.png" alt="Logo da Argos"
                    class="h-8 w-auto object-contain">
                <p class="self-center text-xl font-semibold">Argos</p>
            </div>

            <div class="px-6 py-6 border-b border-white/10 shrink-0">
                <div
                    class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                    V
                </div>
                <p class="mt-3 text-white/60">Olá,</p>
                <p class="text-lg font-bold">Vivian</p>
            </div>

            <nav class="flex flex-col py-4">
                <a href="../home.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Home</a>
                <a href="../empresas/index.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Empresas</a>
                <a href="./index.html"
                    class="px-6 py-3.5 text-sm font-bold text-light-blue border-l-2 border-light-blue bg-light-blue/5">Funcionários</a>
                <a href="../chamados/index.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Histórico
                    de Chamados</a>
                <a href="../relatorio.html"
                    class="px-6 py-3.5 text-sm text-white/70 border-l-2 border-transparent hover:text-white hover:bg-white/5 transition-element">Gerar
                    Relatório</a>
            </nav>
        </div>

        <div class="border-t border-white/10 py-4 shrink-0">
            <a href="../configuracoes/index.html"
                class="block px-6 py-3.5 text-sm text-white/40 hover:text-white transition-element">Configurações</a>
            <a href="#" class="block px-6 py-3.5 text-sm text-white/40 hover:text-red-500 transition-element">Sair</a>
        </div>

    </aside>

    <main class="flex-1 h-full overflow-y-auto p-4 pt-16 md:p-8 md:pt-8">
        <div class="max-w-4xl mx-auto w-full">

            <header class="flex flex-col justify-between gap-4 md:flex-row md:items-center mb-6">
                <p class="text-white text-2xl font-semibold">Funcionários</p>
                <button
                    class="flex items-center justify-center gap-2 px-5 py-2.5 rounded-md bg-light-blue text-main-blue text-sm hover:brightness-110 transition-element cursor-pointer w-full md:w-auto"
                    onclick="abrirModal()">
                    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    Adicionar Funcionário
                </button>
            </header>

            <section id="lista-funcionarios-container" class="w-full flex flex-col gap-3">
                <div class="flex items-center justify-between px-6 py-5 rounded-xl border border-white/10 bg-[#0D1924]">
                    <div class="flex items-center gap-3">
                        <div
                            class="size-12 rounded-full grid place-items-center bg-main-purple border-2 border-[#2d3a6b] text-light-blue text-xl font-bold">
                            F</div>
                        <span class="text-base">Funcionário 1</span>
                    </div>
                    <div class="flex items-center gap-4 text-white/60">
                        <a href="./editarFuncionario.html"
                            class="hover:text-light-blue cursor-pointer transition-element outline-none focus:outline-none focus:ring-0">
                            <svg class="size-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6" />
                                <path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                            </svg>
                        </a>
                        <button type="button"
                            class="hover:text-red-400 cursor-pointer transition-element outline-none focus:outline-none focus:ring-0"
                            onclick="abrirModalExcluir()">
                            <svg class="size-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="w-full max-w-md rounded-2xl border border-white/10 bg-[#0D1924] p-8 shadow-2xl">
            <div class="flex items-center justify-between">
                <h2 id="modal_titulo" class="text-xl font-bold">Adicionar Funcionário</h2>
                <button class="text-white/60 hover:text-white text-2xl leading-none transition-element cursor-pointer"
                    onclick="fecharModal()">&times;</button>
            </div>
            <form class="mt-6 flex flex-col gap-5" onsubmit="event.preventDefault();">
                <div class="flex flex-col gap-2">
                    <label for="email" class="text-sm font-bold text-white/60">E-mail</label>
                    <input id="email" type="text" placeholder="E-mail institucional do usuário"
                        class="w-full rounded-md border border-white/15 bg-main-blue px-4 py-3 text-sm placeholder:text-white/40 focus:border-light-blue focus:outline-none transition-element">
                </div>
                <div class="flex justify-end gap-3 mt-2">
                    <button type="button" onclick="fecharModal()"
                        class="px-6 py-2.5 rounded-md text-white/90 text-sm font-medium hover:bg-white/5 transition-element cursor-pointer border border-white/15">Cancelar</button>
                    <button type="submit"
                        class="px-6 py-2.5 rounded-md bg-light-blue text-main-blue text-sm font-bold hover:brightness-110 transition-element cursor-pointer">Enviar
                        token de acesso</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal_excluir"
        class="hidden fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="w-full max-w-md rounded-2xl border border-white/10 bg-[#0D1924] p-8 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-2">Confirmar Exclusão</h3>
            <p class="text-sm text-white/60 mb-6">Deseja desativar esse funcionário?</p>
            <div class="flex justify-end gap-3">
                <button type="button" onclick="fecharModalExcluir()"
                    class="px-5 py-2.5 rounded-md border border-white/20 text-sm font-bold text-white hover:bg-white/10 transition-element">Não</button>
                <button type="button" onclick="fecharModalExcluir()"
                    class="px-6 py-2.5 rounded-md bg-red-600 text-white text-sm font-bold hover:bg-red-700 transition-element">Sim</button>
            </div>
        </div>
    </div>

</body>

</html>
