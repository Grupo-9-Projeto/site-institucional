<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../output.css">
</head>
<body>
    <div class="h-screen w-screen bg-[#09121B] flex flex-row gap-4 p-8 text-white">
        <div class="w-[70%] flex border border-white bg-gradient-to-b from-[#09121B] to-[#251E47] gradient-border p-10">
            <div>   
                <div class="self-center">
                    <img class="size-12" src="../assets/logos/Argos-logo_branco.png" alt="Logo Argos Branca">
                </div>
                <div class="self-end">
                    <h3>
                        <span>Tenha total controle.</span>
                        <span>Monitore seus equipamentos</span>
                        <span>Cisco com Argos.</span>
                    </h3>
                </div>
            </div>
        </div>
        <div class="w-[30%] flex flex-col gap-20 gradient-border bg-gradient-to-b from-[#09121B] to-[#251E47] p-10">
            <div class="content-center">
                <h1 class="font-medium text-5xl">Cadastre-se</h1>
            </div>
            <div>
                <div>
                    <span>Nome</span>
                    <input type="text" placeholder="Maria Jose da Silva">
                </div>
                <div>
                    <span>Email</span>
                    <input type="text" placeholder="Maria Jose da Silva">
                </div>
                <div>
                    <span>Senha</span>
                    <input type="text" placeholder="Maria Jose da Silva">
                </div>
                <div>
                    <span>Confirmação de Senha</span>
                    <input type="text" placeholder="Maria Jose da Silva">
                </div>
                <div>
                    <span>Token de Acesso</span>
                    <input type="text" placeholder="Maria Jose da Silva">
                </div>
            </div>
            <div>
                <button>Cadastrar</button>
            </div>
        </div>
    </div>
</body>
</html>
