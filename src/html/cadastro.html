<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../output.css">
</head>
<body class="font-space-grotesk select-none">
    <div class=" min-h-screen lg:h-screen w-full bg-[#09121B] flex flex-col lg:flex-row lg:gap-4 lg:p-8 text-white lg:overflow-hidden">
        <div class="w-full gradient-border lg:w-[65%] lg:min-w-0 flex lg:border lg:border-white bg-transparent lg:bg-gradient-to-b lg:from-[#09121B] lg:to-[#251E47] lg:gradient-border p-4 sm:p-6 lg:p-[clamp(16px,4vh,40px)] lg:overflow-hidden">
            <div class="flex lg:flex-col w-full">   
                <div class="text-2xl md:text-3xl lg:text-[clamp(24px,5.5vh,60px)] shrink-0">
                    <button onclick="history.back()" class="transition-transform duration-300 hover:scale-110">
                        ←
                    </button>
                </div>
                <div class="hidden lg:flex lg:mt-auto flex justify-center shrink-0">
                    <img class="max-w-[44px] sm:max-w-[56px] md:max-w-[80px] lg:max-w-[288px] max-h-[8vh] lg:max-h-[26vh] w-auto h-auto object-contain transition-transform duration-300" src="../assets/logos/Argos-logo_branco.png" alt="Logo Argos Branca">
                </div>
                <div class="hidden lg:block lg:mt-auto lg:flex-none min-w-0">
                    <h3 class="font-medium text-xs sm:text-sm md:text-base lg:text-[clamp(20px,4.4vh,48px)] leading-tight truncate lg:whitespace-normal">
                        <span class="block">Tenha <span class="font-bold">total controle.</span></span>
                        <span class="block">Monitore seus equipamentos</span>
                        <span class="block">Cisco com <span class="font-bold">Argos.</span></span>
                    </h3>
                </div>
            </div>
        </div>
        <div class="w-full flex-1 lg:w-[35%] lg:min-w-0  flex flex-col justify-center gradient-border bg-gradient-to-b from-[#09121B] to-[#251E47] p-5 sm:p-6 md:p-8 lg:p-[clamp(16px,4vh,40px)]  lg:overflow-hidden">
            <div class="">
                <div class="flex items-center justify-center">
                    <h1 class="font-bold text-xl sm:text-2xl lg:text-3xl mb-6 lg:mb-8">
                        Cadastre-se
                    </h1>
                </div>
                <div class="flex flex-col gap-6 sm:gap-8 lg:gap-[clamp(16px,5.4vh,48px)]">
                    <div class="flex flex-col gap-3 lg:gap-[clamp(8px,2.7vh,24px)] w-full font-jet-brains">
                            <div class="flex flex-col gap-1.5">
                                <label for="input_nome" class="text-sm sm:text-base font-medium">Nome</label>
                                <input id="input_nome" type="text" placeholder="Seu nome aqui"
                                    class="w-full text-sm sm:text-base px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-gray-700 bg-[#15293D] placeholder:text-gray-400 focus:outline-none focus:border-[#00BCEB]">
                            </div>

                            <div class="flex flex-col gap-1.5">
                                <label for="input_email" class="text-sm sm:text-base font-medium">Email</label>
                                <input id="input_email" type="email" placeholder="exemplo@gmail.com"
                                    class="w-full text-sm sm:text-base px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-gray-700 bg-[#15293D] placeholder:text-gray-400 focus:outline-none focus:border-[#00BCEB]">
                            </div>

                            <div class="flex flex-col gap-1.5">
                                <label for="input_senha" class="text-sm sm:text-base font-medium">Senha</label>
                                <input id="input_senha" type="password" placeholder="Sua senha aqui"
                                    class="w-full text-sm sm:text-base px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-gray-700 bg-[#15293D] placeholder:text-gray-400 focus:outline-none focus:border-[#00BCEB]">
                            </div>

                            <div class="flex flex-col gap-1.5">
                                <label for="input_confirm_senha" class="text-sm sm:text-base font-medium">Confirmação da Senha</label>
                                <input id="input_confirm_senha" type="password" placeholder="Confirme sua senha aqui"
                                    class="w-full text-sm sm:text-base px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-gray-700 bg-[#15293D] placeholder:text-gray-400 focus:outline-none focus:border-[#00BCEB]">
                            </div>

                            <div class="flex flex-col gap-1.5">
                                <label for="input_token" class="text-sm sm:text-base font-medium">Token de Acesso</label>
                                <input id="input_token" type="text" placeholder="1234-ABCD-5678-EFGH"
                                    class="w-full text-sm sm:text-base px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-gray-700 bg-[#15293D] placeholder:text-gray-400 focus:outline-none focus:border-[#00BCEB]">
                            </div>
                    </div>
                    <div class="w-full">
                        <button onclick="registerUser()" 
                            class="w-full py-2.5 sm:py-3 rounded-xl font-bold text-base sm:text-xl lg:text-2xl text-(--main-blue) bg-(--off-white) border-2 border-transparent transition-all duration-200 hover:scale-102">
                            Cadastrar →
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
