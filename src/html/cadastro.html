<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../output.css">
</head>
<body class="font-space-grotesk select-none">
    <div class=" min-h-screen lg:h-screen w-full bg-[#09121B] flex flex-col lg:flex-row lg:gap-4 lg:p-8 text-white lg:overflow-hidden">
        <div class="w-full lg:w-[65%] lg:min-w-0 flex lg:border lg:border-white bg-transparent lg:bg-gradient-to-b lg:from-[#09121B] lg:to-[#251E47] lg:gradient-border p-4 sm:p-6 lg:p-[clamp(16px,4vh,40px)] lg:overflow-hidden">
            <div class="flex lg:flex-col w-full">   
                <div class="text-2xl md:text-3xl lg:text-[clamp(24px,5.5vh,60px)] shrink-0">
                    <button class="transition-transform duration-300 hover:scale-120">
                        ←
                    </button>
                </div>
                <div class="hidden lg:flex lg:mt-auto flex justify-center shrink-0">
                    <img class="max-w-[44px] sm:max-w-[56px] md:max-w-[80px] lg:max-w-[288px] max-h-[8vh] lg:max-h-[26vh] w-auto h-auto object-contain transition-transform duration-300 hover:scale-110" src="../assets/logos/Argos-logo_branco.png" alt="Logo Argos Branca">
                </div>
                <div class="hidden lg:block lg:mt-auto lg:flex-none min-w-0">
                    <h3 class="font-medium text-xs sm:text-sm md:text-base lg:text-[clamp(20px,4.4vh,48px)] leading-tight truncate lg:whitespace-normal">
                        <span class="block">Tenha <span class="font-bold">total controle.</span></span>
                        <span class="block">Monitore seus equipamentos</span>
                        <span class="block">Cisco com <span class="font-bold">Argos.</span></span>
                    </h3>
                </div>
            </div>
        </div>
        <div class="w-full lg:w-[35%]  flex flex-col justify-center gradient-border bg-gradient-to-b from-[#09121B] to-[#251E47] p-10  lg:overflow-hidden">
            <div>
                <div class="flex items-center justify-center">
                    <h1 class="font-bold text-5xl mb-12 transition-transform duration-300 hover:scale-120">Cadastre-se</h1>
                </div>
                <div class="flex flex-col gap-12">
                    <div class="flex flex-col gap-6 w-full font-jet-brains">
                        <div class="flex flex-col gap-2.5">
                            <span class="text-lg">Nome</span>
                            <input class="text-base w-full rounded-[12px] border-2 p-3 px-4 bg-[#15293D] placeholder:text-gray-400" type="text" placeholder="Seu nome aqui">
                        </div>
                        <div class="flex flex-col gap-2.5">
                            <span class="text-lg">Email</span>
                            <input class="text-base w-full rounded-[12px] border-2 p-3 px-4 bg-[#15293D] placeholder:text-gray-400" type="text" placeholder="exemplo@gmail.com">
                        </div>
                        <div class="flex flex-col gap-2.5">
                            <span class="text-lg">Senha</span>
                            <input class="text-base w-full rounded-[12px] border-2 p-3 px-4 bg-[#15293D] placeholder:text-gray-400" type="password" placeholder="Sua senha aqui">
                        </div>
                        <div class="flex flex-col gap-2.5">
                            <span class="text-lg">Confirmação da Senha</span>
                            <input class="text-base w-full rounded-[12px] border-2 p-3 px-4 bg-[#15293D] placeholder:text-gray-400" type="password" placeholder="Confirme sua senha aqui">
                        </div>
                        <div class="flex flex-col gap-2.5">
                            <span class="text-lg">Token de Acesso</span>
                            <input class="text-base w-full rounded-[12px] border-2 p-3 px-4 bg-[#15293D] placeholder:text-gray-400" type="text" placeholder="1234-ABCD-5678-EFGH">
                        </div>
                    </div>
                    <div class="w-full">
                        <button class="transition-transform duration-300 hover:scale-105 w-full p-2.5 rounded-[12px] text-(--main-blue) font-bold text-3xl bg-(--off-white) transition-element transition-all duration-200 hover:border-4 hover:border-(--light-blue)">Cadastrar →</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
